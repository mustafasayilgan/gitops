apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.mongo.name }}
  labels:
    app: {{ .Values.mongo.name }}
spec:
  replicas: {{ .Values.mongo.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.mongo.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.mongo.name }}
    spec:
      containers:
        - name: {{ .Values.mongo.name }}
          image: {{ .Values.mongo.image }}
          ports:
            - containerPort: {{ .Values.mongo.port }}
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mongo.secretName }}
                  key: MONGO_INITDB_ROOT_USERNAME
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mongo.secretName }}
                  key: MONGO_INITDB_ROOT_PASSWORD
            - name: MONGO_INITDB_DATABASE
              value: {{ .Values.mongo.database | quote }}
            - name: MONGO_APP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mongo.secretName }}
                  key: MONGO_APP_USERNAME
            - name: MONGO_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mongo.secretName }}
                  key: MONGO_APP_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /data/db
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.mongo.name }}-data
        - name: init
          configMap:
            name: {{ .Values.mongo.name }}-init
            defaultMode: 0755
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.mongo.name }}
  labels:
    app: {{ .Values.mongo.name }}
spec:
  selector:
    app: {{ .Values.mongo.name }}
  ports:
    - name: mongo
      port: {{ .Values.mongo.port }}
      targetPort: {{ .Values.mongo.port }}
  type: ClusterIP
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.mongo.name }}-init
  labels:
    app: {{ .Values.mongo.name }}
data:
  01-create-app-user.sh: |
    #!/bin/bash
    set -e
    mongosh admin -u "$MONGO_INITDB_ROOT_USERNAME" -p "$MONGO_INITDB_ROOT_PASSWORD" <<EOF
    db = db.getSiblingDB("$MONGO_INITDB_DATABASE")
    db.createUser({
      user: "$MONGO_APP_USERNAME",
      pwd: "$MONGO_APP_PASSWORD",
      roles: [{ role: "readWrite", db: "$MONGO_INITDB_DATABASE" }]
    })
    EOF
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.mongo.name }}-data
  labels:
    app: {{ .Values.mongo.name }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.mongo.persistence.size }}
  {{- with .Values.mongo.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}