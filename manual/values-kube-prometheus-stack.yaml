# helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
# helm upgrade --install monitoring prometheus-community/kube-prometheus-stack \
#   -n monitoring --create-namespace -f manual/values-kube-prometheus-stack.yaml

alertmanager:
  enabled: false

grafana:
  enabled: true
  adminPassword: admin
  persistence:
    enabled: false
  service:
    type: ClusterIP
  ingress:
    enabled: true
    ingressClassName: nginx
    hosts:
      - grafana.hepapi.test
    annotations:
      nginx.ingress.kubernetes.io/ssl-redirect: "false"

prometheus:
  prometheusSpec:
    retention: 24h
    scrapeInterval: 30s
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 512Mi
    storageSpec: {}

# needed for grafana "compute resources" dashboards (cadvisor)
kubelet:
  enabled: true
  serviceMonitor:
    https: true
    insecureSkipVerify: true

prometheusOperator:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 128Mi

# keep cluster metrics exporters
nodeExporter:
  enabled: true

kubeStateMetrics:
  enabled: true

defaultRules:
  create: true
  rules:
    alertmanager: false
    etcd: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false
    kubeControllerManager: false
